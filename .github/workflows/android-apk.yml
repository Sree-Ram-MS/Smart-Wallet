name: Build Android APK

on:
  push:
    branches: [web-version]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  # Queue instead of cancel, so a quick second push doesn't kill a build.
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: web-version-latest
      APK_NAME: smart-wallet-web-version.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # Release builds are signed with the debug key (android/app/build.gradle.kts).
      # Optional: put a base64 debug.keystore in the ANDROID_DEBUG_KEYSTORE_BASE64
      # secret (store/key password "android", alias "androiddebugkey") so every
      # CI APK has the same signature as the app already on the phone.
      # Without it, the runner creates a fresh debug key for each build.
      - name: Use saved debug keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the debug keystore from secrets."
          else
            echo "No keystore secret: signing with a fresh runner debug key."
          fi

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Signing certificate
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_NAME" | grep -E 'SHA-1|SHA-256' | tee cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: smart-wallet-apk
          path: ${{ env.APK_NAME }}

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          {
            echo "Android APK built from \`web-version\` at ${GITHUB_SHA::7} (version $VERSION)."
            echo
            echo "Signed with a debug key. If your installed app has a different signature, Android refuses the update: uninstall first, then restore from Google Drive."
            echo
            echo '```'
            cat cert.txt 2>/dev/null || true
            echo '```'
          } > notes.md
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Smart Wallet $VERSION (web-version, latest)" \
            --notes-file notes.md
