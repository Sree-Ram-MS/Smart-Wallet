name: Deploy web to GitHub Pages

on:
  push:
    branches: [web-version]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec: sdk ^3.12.2, pubspec.lock: flutter >=3.44.0.
      # Verified with Flutter 3.47.9 (Dart 3.13.7).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build web --release --base-href /Smart-Wallet/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
