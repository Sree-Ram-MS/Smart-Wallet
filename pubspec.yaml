name: smart_wallet
description: "A personal finance & wallet tracking app."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Auth & Biometric & Google Drive
  google_sign_in: ^6.2.2
  # Web-only sign-in button (renderButton) and token access for the web build
  google_sign_in_web: ^0.12.4
  google_sign_in_platform_interface: ^2.5.0
  googleapis: ^13.2.0
  googleapis_auth: ^2.3.3
  http: ^1.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  local_auth: ^2.3.0

  # UI / Charts / Fonts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^4.0.0
  flex_color_picker: ^3.6.0

  # File & CSV
  csv: ^6.0.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5

  # Notifications & Home Widget
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.9.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  # Web support: gzip without dart:io, and browser APIs (downloads)
  archive: ^3.6.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
